[project]
name = "medicart"
version = "0.1.0"
description = "MediCart - online pharmacy with AI-assisted prescription reading"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "openai>=1.50",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pypdfium2>=4.30",
    "rapidocr-onnxruntime>=1.3",
    "rapidfuzz>=3.9",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
handwriting = [
    "torch>=2.2",
    "transformers>=4.44",
    "pillow>=10",
]
data = [
    "kagglehub>=0.3",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.vercel.scripts]
build = "cd frontend && npm ci && npm run build"

[tool.vercel.fastapi.static]
cdn = true

[tool.uv]
package = false
# rapidocr pulls the GUI build of OpenCV; the headless build is enough and loads on serverless Linux.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::sqlalchemy.exc.SAWarning"]
markers = ["slow: tests that load OCR models"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP046"]

[tool.ruff.lint.per-file-ignores]
"backend/app/ai/prompts.py" = ["E501"]
"backend/tests/**" = ["E501"]
"backend/scripts/**" = ["E501"]
